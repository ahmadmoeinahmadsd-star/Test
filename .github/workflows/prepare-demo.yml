name: Prepare demo audiobook

on:
  push:
    paths: ["tools/transcribe.py", ".github/workflows/prepare-demo.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download public-domain audio (LibriVox, Grimm - Hansel and Gretel)
        run: |
          mkdir -p app/src/main/assets/demo
          curl -L --fail -o app/src/main/assets/demo/hansel.mp3 \
            https://archive.org/download/grimms_english_librivox/grimm_19_hanselgretel_64kb.mp3
          ls -la app/src/main/assets/demo
      - name: Transcribe with timestamps
        run: |
          pip install -q faster-whisper==1.1.1
          python tools/transcribe.py app/src/main/assets/demo/hansel.mp3 app/src/main/assets/demo/transcript.json
      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add app/src/main/assets/demo
          git commit -m "Add demo audio and transcript" || exit 0
          git pull --rebase origin main
          git push
